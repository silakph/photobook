<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="only light">
<title>Photobook</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@800&amp;family=Nunito:wght@600;700&amp;display=swap" rel="stylesheet">
<style>
:root{--ink:#1A1C22; --soft:#5A5E68; --page:#F4F1EA; --card:#FFFFFF; color-scheme:only light}
*{box-sizing:border-box}
body{margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px; background:var(--page); color:var(--ink); font:600 1rem/1.5 "Nunito", system-ui, sans-serif}
.card{max-width:28rem; text-align:center; background:var(--card); border-radius:16px; padding:36px 28px; box-shadow:0 10px 30px rgba(0,0,0,.08)}
h1{margin:0 0 8px; font-family:"Playfair Display", Georgia, serif; font-weight:800; font-size:2.2rem}
p{margin:0; color:var(--soft)}
</style>
</head>
<body>
<main class="card">
  <h1>Photobook</h1>
  <p>Coming soon: design photobook pages and download them as print-ready PDFs.</p>
</main>
</body></html>
